# .github/workflows/linux-preview-release.yml
#
# Publishes the Linux machine preview as a pre-release (tag linux-preview-<run>) on this fork: Henge.ipa
# as a plain file, which Safari downloads straight (and can resume, unlike a zipped build
# artifact), and the Ubuntu Xfce machine as Henge-Ubuntu-Xfce.zip (a folder the app brings in).
# It takes the files from the builds named below rather than building them again.
#
# Runs on pushes to the Linux machine's branch that change this file, or by hand once it is on
# the default branch.

name: Linux preview release

on:
  push:
    branches: ["claude/linux-runner-crash-flumcd"]
    paths: [".github/workflows/linux-preview-release.yml"]
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

env:
  IPA_RUN: "44442186983"    # Build Henge IPA, commit df28db3 (Linux screen at 60 Hz)
  LINUX_RUN: "44442406973"  # Linux machine, commit 23c7459 (Ubuntu 24.04 Xfce with Firefox and Ubuntu's look)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: The app
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.IPA_RUN }}
          github-token: ${{ github.token }}
          pattern: Henge-ipa-*
          path: dl/ipa

      - name: The Ubuntu machine
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.LINUX_RUN }}
          github-token: ${{ github.token }}
          pattern: henge-ubuntu-xfce-*
          path: dl/ubuntu

      - name: Assemble
        run: |
          set -euo pipefail
          mkdir -p out "Ubuntu Xfce"
          cp dl/ipa/*/Henge.ipa out/Henge.ipa
          cp dl/ubuntu/*/Image dl/ubuntu/*/disk.img.hvsparse dl/ubuntu/*/machine.json "Ubuntu Xfce/"
          # Compressed: a release file must be under 2 GiB, and the disk with Firefox is 2.4 GB packed.
          zip -6 -r out/Henge-Ubuntu-Xfce.zip "Ubuntu Xfce"
          size=$(stat -c %s out/Henge-Ubuntu-Xfce.zip)
          echo "machine zip: $size bytes"
          [ "$size" -lt 2147483648 ] || { echo "still over GitHub's 2 GiB limit for a release file"; exit 1; }
          ls -la out "Ubuntu Xfce"
          (cd out && sha256sum Henge.ipa Henge-Ubuntu-Xfce.zip > SHA256SUMS)
          cat out/SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A new tag each run, as the app's own build does: recreating a deleted release's tag was refused (HTTP 403).
          TAG="linux-preview-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          ipa=$(stat -c %s out/Henge.ipa); ub=$(stat -c %s out/Henge-Ubuntu-Xfce.zip)
          cat > notes.md <<EOF
          Henge with the **Linux machine** (docs/linux-machine.md on the branch claude/linux-runner-crash-flumcd): Ubuntu 24.04 with the Xfce desktop on Henge's engine. A preview: tried on GitHub's arm64 runners, not yet on a phone.

          1. **Henge.ipa** ($ipa bytes): install it as you install Henge. It includes league-el0.
          2. **Henge-Ubuntu-Xfce.zip** ($ub bytes): check the size once it is downloaded, tap it in Files to unzip (it is about twice that size unzipped, so leave room), and bring the **Ubuntu Xfce** folder into Henge as you bring in a Mac.
          3. Start it: Linux's text, then the desktop, signed in as **henge** (no password, sudo works).

          Firefox is in the dock and the Applications menu. Trackpad: one finger moves the pointer, two scroll, tap clicks, two-finger tap right-clicks, the volume press is the left button. No GPU acceleration yet; no instant resume for Linux.
          EOF
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Linux machine preview" --notes-file notes.md \
              out/Henge.ipa out/Henge-Ubuntu-Xfce.zip out/SHA256SUMS
