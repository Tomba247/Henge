# .github/workflows/linux-machine.yml
#
# The Linux machine (docs/linux-machine.md), built and tried on a GitHub-hosted
# arm64 Linux runner, where HengeVM's engine runs natively (no phone, no Mac):
#
# 1. builds tools/hengelinux, the engine with the Linux machine, for arm64 Linux;
# 2. builds the machine's kernel (tools/linux/build-kernel.sh: 16 KB pages, what
#    the engine runs fastest), cached between runs;
# 3. makes an Ubuntu machine with tools/linux/make-ubuntu-disk.sh, with the Xfce
#    desktop and with Ubuntu's GNOME desktop, one job each (the runner runs the
#    image's arm64 apt itself);
# 4. boots it on the engine, with virtio-gpu as its display (as the app), and henge.autotest on the kernel's command line:
#    the image reports what came up on the serial console and powers off;
# 5. uploads the machine folder (Image, disk.img.hvsparse, machine.json) for
#    the app to import, and the boot log.
#
# Manual (Actions tab > Linux machine > Run workflow, once this file is on the
# default branch), and on pushes to the Linux machine's branch that touch it
# (the Xfce desktop image then). Free on a public repo: arm64 runners are standard
# runners there.

name: Linux machine

on:
  workflow_dispatch:
    inputs:
      desktop:
        description: "Desktop: gnome (Ubuntu), kali (Kali Xfce), kali-gnome, all (those three, what a release takes), both (Ubuntu Xfce and GNOME), xfce or none (a server). On push: all"
        type: choice
        options: [gnome, kali, kali-gnome, all, both, xfce, none]
        default: gnome
      size:
        description: "Disk size"
        type: string
        default: "60G"
      cpus:
        description: "CPUs for the boot test"
        type: string
        default: "4"
      kernel:
        description: "Kernel: henge (16 KB pages, built here) or ubuntu (stock, 4 KB pages: slow on the engine)"
        type: string
        default: "henge"
      vulkan:
        description: "Try Vulkan (Venus): Vulkan drivers in the image and a boot with Vulkan. Not a machine for a release"
        type: boolean
        default: false
  push:
    branches: ["claude/linux-runner-crash-flumcd"]
    paths:
      - "core/**"
      - "devices/linuxvirt.*"
      - "devices/fdt.*"
      - "devices/virtio_gpu.*"
      - "devices/vgpu_virgl.*"
      - "devices/virtio.*"
      - "host/linux/**"
      - "tools/hengelinux.c"
      - "tools/linux/**"
      - ".github/workflows/linux-machine.yml"

jobs:
  ubuntu:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    # One machine per desktop: Xfce (LightDM) and GNOME (Ubuntu's desktop, GDM), side by side on pushes.
    strategy:
      fail-fast: false
      matrix:
        desktop: ${{ fromJSON((inputs.desktop == 'xfce' && '["xfce"]') || (inputs.desktop == 'gnome' && '["gnome"]') || (inputs.desktop == 'none' && '["none"]') || (inputs.desktop == 'kali' && '["kali"]') || (inputs.desktop == 'kali-gnome' && '["kali-gnome"]') || (inputs.desktop == 'both' && '["xfce", "gnome"]') || '["gnome", "kali", "kali-gnome"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debootstrap build-essential e2fsprogs kmod zstd xz-utils curl bc bison flex libssl-dev libelf-dev python3 \
              libvirglrenderer-dev libepoxy-dev libegl-dev libgbm-dev libegl-mesa0 libgl1-mesa-dri libgles2 pkg-config
          if [ "${{ inputs.vulkan || false }}" = true ]; then
            sudo apt-get install -y -qq --no-install-recommends virgl-server mesa-vulkan-drivers vulkan-tools libvulkan-dev \
                meson ninja-build python3-yaml libdrm-dev
          fi

      - name: Build the engine with the Linux machine (native arm64)
        run: |
          make linux-test LXCC=gcc
          # And with 3D for virtio-gpu through virglrenderer (the runner's Mesa, surfaceless EGL).
          make linux-test LXCC=gcc LX_VIRGL=1 LXB=build/linux-virgl

      - name: Kernel cache
        if: ${{ (inputs.kernel || 'henge') == 'henge' }}
        uses: actions/cache@v4
        with:
          path: kernel
          key: henge-kernel-6.12-${{ hashFiles('tools/linux/henge-kernel.config', 'tools/linux/build-kernel.sh') }}

      - name: Build the kernel (16 KB pages)
        if: ${{ (inputs.kernel || 'henge') == 'henge' }}
        run: |
          if [ -f kernel/Image ]; then echo "cached: Linux $(cat kernel/release)"; exit 0; fi
          tools/linux/build-kernel.sh kernel
          ls -la kernel

      - name: Make the Ubuntu machine
        run: |
          set -euo pipefail
          kernel=""
          if [ -f kernel/Image ]; then kernel="--kernel-dir kernel"; fi
          case "${{ matrix.desktop }}" in xfce) desktop=--desktop ;; gnome) desktop=--gnome ;; kali) desktop="--kali --desktop" ;; kali-gnome) desktop="--kali --gnome" ;; *) desktop="" ;; esac
          if [ "${{ inputs.vulkan || false }}" = true ]; then desktop="$desktop --vulkan"; fi
          sudo tools/linux/make-ubuntu-disk.sh machine --size "${{ inputs.size || '60G' }}" $desktop $kernel
          sudo chown -R "$(id -u):$(id -g)" machine
          ls -la machine
          cat machine/machine.json

      - name: Boot it on the engine
        run: |
          set -uo pipefail
          # A copy, so the machine handed out has never been booted.
          cp --sparse=always machine/disk.img boot-test.img
          HV_FB_DUMP=screen.ppm timeout 3600 build/linux/hengelinux --kernel machine/Image --disk boot-test.img \
              --cpus "${{ inputs.cpus || '4' }}" --ram 4096 --fb 1280x800 --gpu \
              --append "console=ttyAMA0 root=/dev/vda rw rootwait henge.autotest" \
              < /dev/null 2>&1 | tee boot.log
          rm -f boot-test.img
          sed -n '/henge-autotest: Ubuntu is up/,/henge-autotest: end/p' boot.log
          # The screen as the machine left it, as a PNG (what the app would have shown).
          [ -f screen.ppm ] && python3 tools/linux/ppm2png.py screen.ppm screen.png
          grep -q "henge-autotest: Ubuntu is up" boot.log
          # A desktop machine is handed out only if its desktop came up.
          if [ "${{ matrix.desktop }}" != none ]; then grep -q "^desktop: .* up after" boot.log; fi

      - name: Boot it again with 3D (virgl)
        if: ${{ success() && !inputs.vulkan }}
        continue-on-error: true
        run: |
          set -uo pipefail
          cp --sparse=always machine/disk.img boot-test.img
          HV_FB_DUMP=screen-virgl.ppm HV_VGPU_LOG=0 timeout 1800 build/linux-virgl/hengelinux --kernel machine/Image --disk boot-test.img \
              --cpus "${{ inputs.cpus || '4' }}" --ram 4096 --fb 1280x800 --virgl \
              --append "console=ttyAMA0 root=/dev/vda rw rootwait henge.autotest" \
              < /dev/null 2>&1 | tee boot-virgl.log
          rm -f boot-test.img
          grep -E "^virgl:|^virtio-gpu:|glamor|^gl:|glxinfo said|^vulkan:|^vkcube:|^venus:" boot-virgl.log | head -60
          sed -n '/henge-autotest: Ubuntu is up/,/henge-autotest: end/p' boot-virgl.log
          [ -f screen-virgl.ppm ] && python3 tools/linux/ppm2png.py screen-virgl.ppm screen-virgl.png
          grep -q "gl: .*virgl" boot-virgl.log

      - name: Boot it with 3D the iPhone's way (own EGL contexts, OpenGL ES)
        if: ${{ success() && !inputs.vulkan }}
        continue-on-error: true
        run: |
          set -uo pipefail
          cp --sparse=always machine/disk.img boot-test.img
          HV_FB_DUMP=screen-gles.ppm HV_VGPU_LOG=0 HV_VIRGL_OWN_EGL=1 HV_VIRGL_LOG=1 timeout 1800 build/linux-virgl/hengelinux --kernel machine/Image \
              --disk boot-test.img --cpus "${{ inputs.cpus || '4' }}" --ram 4096 --fb 1280x800 --virgl \
              --append "console=ttyAMA0 root=/dev/vda rw rootwait henge.autotest" \
              < /dev/null 2>&1 | tee boot-gles.log
          rm -f boot-test.img
          grep -E "^virgl:|^virtio-gpu:|glamor|^gl:|glxinfo said|^vulkan:|^vkcube:|^venus:" boot-gles.log | head -90
          [ -f screen-gles.ppm ] && python3 tools/linux/ppm2png.py screen-gles.ppm screen-gles.png
          grep -q "gl: .*virgl" boot-gles.log

      # Vulkan for the guests is Venus: Mesa's Venus driver in the guest, virglrenderer on the host, the host's
      # Vulkan under it. This tries the host's half with no machine at all: Mesa's Venus driver talks to
      # virglrenderer's test server over a socket (as it would over virtio-gpu), on lavapipe, the software Vulkan
      # a runner has. If this passes and a guest's Venus does not, the fault is in the machine's virtio-gpu.
      - name: Venus on this runner, without a machine (Mesa's Venus driver, virglrenderer, lavapipe)
        if: ${{ success() && inputs.vulkan }}
        continue-on-error: true
        run: |
          set -uo pipefail
          lvp=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          venus=$(ls /usr/share/vulkan/icd.d/virtio_icd*.json | head -1)
          want="VK_(KHR_swapchain|KHR_external_(memory|semaphore|fence)_fd|EXT_external_memory_dma_buf|EXT_image_drm_format_modifier|EXT_queue_family_foreign)\\b"
          # lavapipe shares memory and fences with other drivers through udmabuf, which is root's on a runner.
          ls -la /dev/udmabuf /dev/dri 2>&1 | head -8
          sudo chmod a+rw /dev/udmabuf 2>/dev/null || true
          echo "host lavapipe: $(VK_ICD_FILENAMES="$lvp" vulkaninfo 2>/dev/null | grep -oE "$want" | sort -u | tr '\n' ' ')" | tee vtest.log
          VK_ICD_FILENAMES="$lvp" virgl_test_server --venus --no-virgl --socket-path "$PWD/vtest.sock" > vtest-server.log 2>&1 &
          for i in $(seq 40); do [ -S vtest.sock ] && break; sleep 0.5; done
          VTEST_SOCKET_NAME="$PWD/vtest.sock" VN_DEBUG=vtest,init VK_ICD_FILENAMES="$venus" timeout 180 vulkaninfo > vtest-full.log 2>&1
          echo "vulkaninfo: exit $?" | tee -a vtest.log
          grep -E "MESA-VIRTIO|deviceName|deviceType|driverName|driverInfo|apiVersion|ERROR" vtest-full.log | sort -u | head -30 | tee -a vtest.log
          echo "host venus (vtest): $(grep -oE "$want" vtest-full.log | sort -u | tr '\n' ' ')" | tee -a vtest.log
          kill %1 2>/dev/null || true
          tail -20 vtest-server.log
          grep -q "deviceName .*Virtio-GPU Venus" vtest-full.log

      # Vulkan: Mesa's Venus driver in the guest, the machine's virtio-gpu (blobs, the host-visible window, context
      # types), virglrenderer's render server, and lavapipe as the host's Vulkan (a runner has no GPU).
      - name: Boot it with Vulkan (Venus, on lavapipe)
        if: ${{ success() && inputs.vulkan }}
        continue-on-error: true
        run: |
          set -uo pipefail
          cp --sparse=always machine/disk.img boot-test.img
          lvp=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          HV_FB_DUMP=screen-venus.ppm HV_VGPU_LOG=0 HV_VIRGL_LOG=1 VK_ICD_FILENAMES="$lvp" timeout 1800 build/linux-virgl/hengelinux --kernel machine/Image \
              --disk boot-test.img --cpus "${{ inputs.cpus || '4' }}" --ram 4096 --fb 1280x800 --venus \
              --append "console=ttyAMA0 root=/dev/vda rw rootwait henge.autotest=gpu" \
              < /dev/null 2>&1 | tee boot-venus.log
          rm -f boot-test.img
          [ -f screen-venus.ppm ] && python3 tools/linux/ppm2png.py screen-venus.ppm screen-venus.png
          grep -q "^desktop: .* up after" boot-venus.log
          grep -q "gl: .*virgl" boot-venus.log
          grep -q "^venus: .*devices: .*Virtio-GPU Venus" boot-venus.log

      # The same with the virglrenderer the app carries (UTM's fork at the commit ios/scripts/build-gpu-deps.sh
      # pins, with ios/patches), built here for Linux with its render server as threads, as in the app.
      - name: Boot it with Vulkan on the app's virglrenderer (render server as threads)
        if: ${{ success() && inputs.vulkan }}
        continue-on-error: true
        run: |
          set -uo pipefail
          repo=$(sed -n 's/^VIRGL_REPO=//p' ios/scripts/build-gpu-deps.sh)
          commit=$(sed -n 's/^VIRGL_COMMIT=//p' ios/scripts/build-gpu-deps.sh)
          git init -q virgl-fork
          git -C virgl-fork fetch -q --depth 1 "$repo" "$commit"
          git -C virgl-fork checkout -q FETCH_HEAD
          for p in ios/patches/virglrenderer-*.patch; do [ -f "$p" ] && git -C virgl-fork apply "$PWD/$p" && echo "patched: $p"; done
          meson setup virgl-fork/build virgl-fork --prefix="$PWD/virgl-fork/inst" --libdir=lib --buildtype=release -Dtests=false -Dcheck-gl-errors=false \
              -Dvenus=true -Dneptune=false -Dplatforms=egl -Dvideo=false -Dvtest=false -Drender-server-mode=thread -Drender-server-worker=thread \
              -Dc_args="-Wno-error=pedantic -Wno-pedantic" > meson-fork.log 2>&1 || { tail -30 meson-fork.log; exit 1; }
          meson compile -C virgl-fork/build > ninja-fork.log 2>&1 || { grep -E "error|FAILED" -A6 ninja-fork.log | head -60; exit 1; }
          meson install -C virgl-fork/build > /dev/null
          PKG_CONFIG_PATH="$PWD/virgl-fork/inst/lib/pkgconfig" make linux-test LXCC=gcc LX_VIRGL=1 LXB=build/linux-virgl-fork > make-fork.log 2>&1 || { grep -E "error" -A4 make-fork.log | head -40; exit 1; }
          export LD_LIBRARY_PATH="$PWD/virgl-fork/inst/lib"
          ldd build/linux-virgl-fork/hengelinux | grep virgl
          cp --sparse=always machine/disk.img boot-test.img
          lvp=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          HV_FB_DUMP=screen-venus-fork.ppm HV_VGPU_LOG=0 HV_VIRGL_LOG=1 VK_ICD_FILENAMES="$lvp" timeout 1800 build/linux-virgl-fork/hengelinux --kernel machine/Image \
              --disk boot-test.img --cpus "${{ inputs.cpus || '4' }}" --ram 4096 --fb 1280x800 --venus \
              --append "console=ttyAMA0 root=/dev/vda rw rootwait henge.autotest=gpu" \
              < /dev/null 2>&1 | tee boot-venus-fork.log
          rm -f boot-test.img
          [ -f screen-venus-fork.ppm ] && python3 tools/linux/ppm2png.py screen-venus-fork.ppm screen-venus-fork.png
          grep -q "^venus: .*devices: .*Virtio-GPU Venus" boot-venus-fork.log

      - name: Pack the disk
        if: always()
        run: |
          if [ -f machine/disk.img ]; then
            cc -O2 -std=gnu11 -Ihost tools/hvsparse_main.c host/hvsparse.c -o hvsparse
            ./hvsparse pack machine/disk.img machine/disk.img.hvsparse
            rm machine/disk.img
            du -sh machine/*
          fi

      - name: Upload the machine
        if: success()
        uses: actions/upload-artifact@v4
        with:
          # A machine made to try Vulkan has another name, so the app's build (which takes henge-ubuntu-*) leaves it.
          name: henge-${{ inputs.vulkan && 'vulkan' || 'ubuntu' }}-${{ matrix.desktop == 'none' && 'server' || matrix.desktop }}-${{ github.sha }}
          path: machine/
          retention-days: 14
          compression-level: 0

      - name: Upload the boot log and the screen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-log-${{ matrix.desktop }}-${{ github.sha }}
          path: |
            boot.log
            screen.png
            boot-virgl.log
            screen-virgl.png
            boot-gles.log
            screen-gles.png
            boot-venus.log
            screen-venus.png
            boot-venus-fork.log
            screen-venus-fork.png
            vtest.log
          if-no-files-found: ignore

      # Last, so the end of the job's log is what the boots found (the uploads above fill pages of it).
      - name: What the boots found
        if: always()
        run: |
          for log in vtest boot boot-virgl boot-gles boot-venus boot-venus-fork; do
            [ -f $log.log ] || continue
            echo "== $log"
            grep -aE "^virgl: (Venus|no Venus|renderer|EGL|blob)|^virtio-gpu: (blob|command|the guest)|vkr: |proxy: |render_server|^linuxvirt:|^desktop:|^gl:|glxinfo said|^vulkan:|^vkcube:|^venus|^host |deviceName|vulkaninfo: exit|^state:|^firefox (version|window)|^chrome|^yt-dlp|^network manager:|^video |^sound:|hengelinux: (stopped|virtio-gpu screen)|henge-autotest: end|^screen " $log.log | cut -c1-230 | awk '!seen[$0]++ || /^venus|^vulkan|^vkcube/' | head -110
          done
          # About what the release's zip of this machine will weigh (it must stay under 2 GiB).
          [ -f machine/disk.img.hvsparse ] && echo "disk: $(stat -c %s machine/disk.img.hvsparse) bytes packed, about $(zstd -3 -T0 -c machine/disk.img.hvsparse | wc -c) compressed"
