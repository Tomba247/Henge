# .github/workflows/build-henge.yml
#
# Builds a Henge.ipa from your fork's main branch on a GitHub-hosted macOS
# runner, no Mac needed. Free on a PUBLIC repo: public repos get unlimited
# minutes on hosted runners, including macOS. On a private repo, macOS minutes
# bill at 10x, so the free tier's ~2000 min/month is only ~200 macOS minutes.
#
# The IPA comes out unsigned with ad-hoc signing (package_ipa.sh's normal
# output). SideStore/AltStore re-signs it with your certificate on install
# and keeps the entitlements it can; increased-memory-limit only survives if
# your certificate carries it, and Henge falls back to file-backed guest RAM
# without it.

name: Build Henge IPA

# Manual only (Actions tab > Build Henge IPA > Run workflow): pushes to main don't build an IPA.
on:
  workflow_dispatch:
    inputs:
      linux_run:
        description: "Linux machine build to attach as Henge-Ubuntu-Xfce.zip (run id; empty: the newest good one on this branch, if any)"
        type: string
        default: ""

env:
  HUSK: ${{ github.workspace }}/Husk
  # The Makefile takes its slirp headers from IOS_DEPS, not HUSK:
  #   IOS_DEPS ?= $(HOME)/Documents/Coding/Husk/build/ios-arm64/sysroot
  # (HUSK is only read by ios/scripts/fetch_deps.sh.)
  IOS_DEPS: ${{ github.workspace }}/Husk/build/ios-arm64/sysroot

jobs:
  build:
    # Xcode 27 image (arm64, GA since Oct 2026). Plain `xcode-27` is a standard
    # runner, so it's free on public repos; `xcode-27-xlarge` is a paid larger
    # runner. Table: https://github.com/actions/runner-images#available-images
    runs-on: xcode-27
    timeout-minutes: 120
    permissions:
      contents: write # the release and the app source branch (the last step)
      actions: read   # the Linux machine's build, attached to the release

    steps:
      - name: Check out Henge (this fork)
        uses: actions/checkout@v4
        with:
          path: Henge

      # Each build gets its own build number, a small step past upstream's: 101 becomes 101.<run number>. The version
      # itself is left alone, so upstream's next release (a higher version or build) still installs over these.
      - name: Number this build
        working-directory: Henge
        run: |
          BASE=$(plutil -extract CFBundleVersion raw ios/Henge/Info.plist)
          plutil -replace CFBundleVersion -string "${BASE%%.*}.${GITHUB_RUN_NUMBER}" ios/Henge/Info.plist
          echo "build $(plutil -extract CFBundleShortVersionString raw ios/Henge/Info.plist) ($(plutil -extract CFBundleVersion raw ios/Henge/Info.plist))"

      # fetch_deps.sh copies prebuilt pieces out of a BUILT Husk checkout:
      # StikJIT.xcframework (vendored in Husk's repo, comes with checkout),
      # libhusk_rppairing.a (scripts/build_rppairing_ios.sh) and the
      # libslirp/glib/intl/pcre2 static libs (scripts/build_ios.sh).
      - name: Check out Husk
        uses: actions/checkout@v4
        with:
          repository: Leviidev/Husk
          path: Husk

      - name: Cache Husk's sources and prebuilt iOS pieces
        uses: actions/cache@v4
        with:
          path: |
            Husk/third_party/build
            Husk/build
          key: husk-ios-arm64-${{ hashFiles('Husk/scripts/build_ios.sh', 'Husk/scripts/fetch_sources.sh') }}

      - name: Install build tools
        run: |
          set -euxo pipefail
          brew install xcodegen meson ninja pkg-config
          # Runner images ship rustup; add the iOS target if it's missing.
          rustup target add aarch64-apple-ios || {
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            rustup target add aarch64-apple-ios
          }

      # build_ios.sh builds from third_party/build/<name>; the sources are
      # fetched by fetch_sources.sh, which Husk's own ci_build.sh runs first.
      - name: Fetch Husk's third-party sources
        working-directory: Husk
        run: bash scripts/fetch_sources.sh

      # Henge only needs these three sysroot pieces: libffi (a glib dep),
      # glib (whose meson subprojects also produce libpcre2-8 and libintl),
      # and libslirp (the guest network). Skip Husk's pixman/libucontext/qemu
      # stages entirely: that's the Android emulator, minutes instead of an
      # hour-plus.
      - name: Build the iOS libraries Henge needs
        working-directory: Husk
        run: bash scripts/build_ios.sh libffi glib libslirp

      - name: Build Husk's on-device pairing library
        working-directory: Husk
        run: bash scripts/build_rppairing_ios.sh

      - name: Copy prebuilt deps into Henge
        working-directory: Henge
        run: zsh ios/scripts/fetch_deps.sh

      - name: Build the restore stack (libirecovery, usbmuxd, idevicerestore)
        working-directory: Henge
        run: zsh tools/build_ios_restore.sh

      # The Linux machine's 3D: the GPU libraries the iOS GPU libraries workflow built (same key, same path),
      # when it has run for this version of its script. Without them the Linux machine's GPU is 2D.
      - name: GPU libraries (from the iOS GPU libraries workflow)
        id: gpu-deps
        uses: actions/cache/restore@v4
        with:
          path: ios/deps-gpu
          key: ios-gpu-deps-${{ hashFiles('Henge/ios/scripts/build-gpu-deps.sh') }}

      - name: Use the GPU libraries
        if: steps.gpu-deps.outputs.cache-hit == 'true'
        run: |
          rm -rf Henge/ios/deps-gpu
          mv ios/deps-gpu Henge/ios/deps-gpu
          cat Henge/ios/deps-gpu/VERSIONS
          ls Henge/ios/deps-gpu/Frameworks

      - name: Compile the Linux screen's Metal shaders (they are otherwise only compiled on the phone)
        working-directory: Henge
        run: |
          python3 -c 'import re,sys; s=open("devices/vgpu_metal.m").read(); b=s[s.index("shaders ="):s.index("\";\n", s.index("shaders ="))+1]; src="".join(re.findall(r"\"((?:[^\"\\]|\\.)*)\"", b)); open("/tmp/vgpu.metal","w").write(src.encode().decode("unicode_escape"))'
          cat /tmp/vgpu.metal
          xcrun -sdk iphoneos metal -c /tmp/vgpu.metal -o /tmp/vgpu.air

      - name: Build the engine
        working-directory: Henge
        run: make ios-lib

      - name: Package Henge.ipa
        working-directory: Henge
        run: zsh ios/scripts/package_ipa.sh

      - name: Upload Henge.ipa
        uses: actions/upload-artifact@v4
        with:
          name: Henge-ipa-${{ github.sha }}
          path: /Users/runner/Desktop/Henge.ipa
          if-no-files-found: error

      - name: Symbol map for the engine profiler
        working-directory: Henge
        run: |
          APP=ios/build/DerivedData/Build/Products/Release-iphoneos
          BIN="$APP/Henge.app.dSYM/Contents/Resources/DWARF/Henge"
          [ -f "$BIN" ] || BIN="$APP/Henge.app/Henge"
          echo "symbols from $BIN"
          nm -n "$BIN" | grep -i " [tT] " > /Users/runner/Desktop/Henge.symbols.txt
          wc -l /Users/runner/Desktop/Henge.symbols.txt
          # Also in this step's log, between markers: a session that cannot download artifacts reads it from here.
          echo "::group::symbol map"
          echo "SYMBOLS-BEGIN"
          cat /Users/runner/Desktop/Henge.symbols.txt
          echo "SYMBOLS-END"
          echo "::endgroup::"

      - name: Upload the symbol map
        uses: actions/upload-artifact@v4
        with:
          name: Henge-symbols-${{ github.sha }}
          path: /Users/runner/Desktop/Henge.symbols.txt
          if-no-files-found: warn

      - name: Package Henge.tipa
        working-directory: Henge
        run: zsh ios/scripts/package_ipa.sh --trollstore

      - name: Upload Henge.tipa
        uses: actions/upload-artifact@v4
        with:
          name: Henge-tipa-${{ github.sha }}
          path: /Users/runner/Desktop/Henge.tipa
          if-no-files-found: error

      # A public release holding the IPA, and an entry for it in the app source on the `source` branch
      # (https://raw.githubusercontent.com/<this fork>/source/source.json: FlareStore, SideStore, AltStore, Feather).
      - name: Publish the release and list it in the app source
        working-directory: Henge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(plutil -extract CFBundleShortVersionString raw ios/Henge/Info.plist)
          BUILD=$(plutil -extract CFBundleVersion raw ios/Henge/Info.plist)
          TAG="${GITHUB_REF_NAME}-${GITHUB_RUN_NUMBER}"
          git log -1 --format=%s | cut -c1-300 > /tmp/notes.txt
          gh release create "$TAG" /Users/runner/Desktop/Henge.ipa /Users/runner/Desktop/Henge.tipa --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Henge $VERSION ($BUILD) from $GITHUB_REF_NAME" --notes-file /tmp/notes.txt --prerelease
          SIZE=$(stat -f %z /Users/runner/Desktop/Henge.ipa)
          git clone --depth 1 --branch source "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/source
          cd /tmp/source
          python3 update_source.py --version "$VERSION" --build "$BUILD" --branch "$GITHUB_REF_NAME" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Henge.ipa" --size "$SIZE" \
            --date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --notes "$(cat /tmp/notes.txt)"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qam "Add $GITHUB_REF_NAME $VERSION ($BUILD)"
          git push -q origin source
          echo "source: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/source/source.json"

      # The Linux machines (docs/linux-machine.md) beside the app, each a folder the app brings in: Henge-Ubuntu-Xfce.zip
      # and Henge-Ubuntu-GNOME.zip, from the same Linux machine build. Only on branches with those builds; release files
      # must be under 2 GiB, so they are compressed.
      - name: Attach the Linux machines to the release
        working-directory: Henge
        env:
          GH_TOKEN: ${{ github.token }}
          LINUX_RUN: ${{ inputs.linux_run }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}-${GITHUB_RUN_NUMBER}"
          run="$LINUX_RUN"
          if [ -z "$run" ]; then
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow linux-machine.yml --branch "$GITHUB_REF_NAME" --status success \
                  -L 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
          fi
          if [ -z "$run" ] || [ "$run" = null ]; then echo "no Linux machine build on $GITHUB_REF_NAME: nothing to attach"; exit 0; fi
          # A Linux machine build still running (started alongside this one): its machines, once it is done (up to an hour).
          for i in $(seq 1 120); do
            st=$(gh run view "$run" --repo "$GITHUB_REPOSITORY" --json status --jq .status 2>/dev/null || echo unknown)
            [ "$st" = completed ] && break
            echo "waiting for Linux machine run $run ($st)"
            sleep 30
          done
          rm -rf /tmp/lm && mkdir -p /tmp/lm
          gh run download "$run" --repo "$GITHUB_REPOSITORY" -p 'henge-ubuntu-*' -D /tmp/lm || { echo "run $run has no Ubuntu machines"; exit 0; }
          cp /tmp/notes.txt /tmp/notes-linux.txt
          echo >> /tmp/notes-linux.txt
          if [ -d ios/deps-gpu/Frameworks ]; then
            echo "**3D for Linux machines:** this build carries the GPU libraries (virglrenderer on ANGLE, which draws with Metal), so a Linux machine's OpenGL runs on the phone's GPU. If a Linux machine misbehaves with them, a line \`HV_LINUX_NO_3D=1\` in Files › On My iPhone › Henge › henge-env.txt turns 3D off (2D, as before)." >> /tmp/notes-linux.txt
            echo >> /tmp/notes-linux.txt
          fi
          for d in /tmp/lm/henge-ubuntu-*; do
            case "$d" in
              *-gnome-*) folder="Ubuntu GNOME" zip=Henge-Ubuntu-GNOME.zip what="Ubuntu's own desktop (GNOME, with Ubuntu's dock)" ;;
              *-xfce-*) folder="Ubuntu Xfce" zip=Henge-Ubuntu-Xfce.zip what="the Xfce desktop" ;;
              *) continue ;;
            esac
            rm -rf /tmp/lmz && mkdir -p "/tmp/lmz/$folder"
            mv "$d"/Image "$d"/disk.img.hvsparse "$d"/machine.json "/tmp/lmz/$folder/"
            rm -rf "$d"
            (cd /tmp/lmz && zip -6 -qr "/tmp/$zip" "$folder")
            size=$(stat -f %z "/tmp/$zip")
            echo "$zip: $size bytes, from Linux machine run $run"
            [ "$size" -lt 2147483648 ] || { echo "$zip is over GitHub's 2 GiB limit for a release file"; exit 1; }
            gh release upload "$TAG" "/tmp/$zip" --repo "$GITHUB_REPOSITORY"
            rm -f "/tmp/$zip"
            echo "- **$zip** ($size bytes): Ubuntu 24.04 with $what and Firefox. Tap it in Files to unzip (about three times that size unzipped), then bring the **$folder** folder into Henge as you bring in a Mac. It signs in as **henge** (no password, sudo works)." >> /tmp/notes-linux.txt
          done
          echo "(Linux machines from https://github.com/$GITHUB_REPOSITORY/actions/runs/$run)" >> /tmp/notes-linux.txt
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file /tmp/notes-linux.txt
