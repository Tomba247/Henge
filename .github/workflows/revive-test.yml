name: HV_REVIVE test (arm64 Linux)

# tests/test_revive.c natively on arm64 cores: two CPUs on one page of code that is rewritten under them, with
# HV_REVIVE on and off. By hand, or by a push that changes the test or this file.
on:
  workflow_dispatch:
  push:
    branches: ["claude/blissful-cori-6o3jo3"]
    paths:
      - tests/test_revive.c
      - .github/workflows/revive-test.yml

jobs:
  linux:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and run
        run: |
          set -uo pipefail
          make linux-test-revive LXCC=gcc LXB=build/linux-dbg LX_DBG=-DHV_DBG_RING 2>&1 | grep -E "error|warning" | head -20 || true
          for i in $(seq 1 150); do
            HV_REVIVE=1 build/linux-dbg/test_revive > dbg.log 2>&1 || { echo "== with the event ring, run $i"; head -230 dbg.log; break; }
          done
          make linux-test-revive LXCC=gcc 2>&1 | grep -E "error|warning" | head -20 || true
          fail=0
          for i in 1 2; do
            for r in 0 1; do
              HV_REVIVE=$r build/linux/test_revive > revive.log 2>&1 || { fail=1; echo "== HV_REVIVE=$r run $i"; cat revive.log; }
            done
          done
          tail -8 revive.log
          exit $fail
